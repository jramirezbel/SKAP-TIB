<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKAP 2.0 · Maltería Tibitó · Conectado a Excel</title>
<style>
:root{--bg:#f5f6f7;--panel:#fff;--ink:#202124;--muted:#6b7075;--line:#e2e4e7;--yellow:#f5c400;--dark:#202124;--green:#2e7d32;--red:#c62828;--blue:#2463eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:235px;background:#18191b;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:18px;padding:8px 10px 22px}.brand small{display:block;color:#aaa;font-weight:500;font-size:11px;margin-top:4px}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cfd1d4;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}
.nav button.active,.nav button:hover{background:#303236;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--yellow)}
.main{flex:1;padding:26px 30px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
.source{font-size:11px;color:var(--muted);text-align:right}.source strong{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.card .label{font-size:12px;color:var(--muted)}.num{font-size:28px;font-weight:800;margin-top:7px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.panel h3{margin:0 0 14px;font-size:15px}
.progress{margin:12px 0}.progress .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.bar{height:8px;background:#eceef0;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--dark);border-radius:99px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:650px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,.select{border:1px solid var(--line);background:#fff;padding:9px 10px;border-radius:8px;font-size:13px;min-width:190px}.btn{border:0;background:var(--dark);color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}.btn.yellow{background:var(--yellow);color:#111}.btn.light{background:#eef0f2;color:#222}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 11px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f7f8f9;color:#555;font-weight:700;position:sticky;top:0;z-index:2}tr:hover td{background:#fafafa}
.badge{display:inline-flex;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:800;white-space:nowrap}.completed{background:#e8f5e9;color:#26702b}.progressb{background:#e8f0ff;color:#2457b7}.delayed{background:#ffebee;color:#b51d2a}.scheduled{background:#fff5d8;color:#7a5a00}.none{background:#eee;color:#666}.info{background:#e9f6ff;color:#12608b}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.person{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;cursor:pointer}.person:hover{border-color:#bbb}.person .name{font-weight:800;font-size:13px}.person .meta{color:var(--muted);font-size:11px;margin-top:4px}.mini{display:flex;justify-content:space-between;margin-top:11px;font-size:11px}.heat{display:grid;grid-template-columns:150px repeat(8,minmax(75px,1fr));font-size:10px;overflow:auto}.heat>div{padding:7px;border-right:1px solid #eee;border-bottom:1px solid #eee;min-height:33px}.heat .head{font-weight:800;background:#f7f8f9}.cell{font-weight:700;text-align:center}.cell.Completado{background:#e8f5e9;color:#26702b}.cell.Retrasado{background:#ffebee;color:#b51d2a}.cell.En\ progreso{background:#e8f0ff;color:#2457b7}.cell.Programado{background:#fff5d8;color:#7a5a00}.cell.Sin\ programar{background:#f1f1f1;color:#666}.cell.NA{background:#f5f5f5;color:#777}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:10px;background:#f7f8f9;border-radius:8px}.field label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}.field div{font-size:13px;line-height:1.4}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#eee;border-radius:8px;padding:7px 10px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:#f7f8f9;border-radius:99px;padding:12px}.kpi b{font-size:20px}.muted{color:var(--muted)}
@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.people{grid-template-columns:1fr}.main{padding:18px}.detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">SKAP 2.0 <small>Maltería Tibitó · Plan de brechas</small></div>
  <div class="nav">
    <button class="active" data-page="dashboard">Dashboard</button>
    <button data-page="people">Personas</button>
    <button data-page="gaps">Brechas & Matriz</button>
    <button data-page="capabilities">Capacidades (63)</button>
    <button data-page="guides">Guías Técnicas</button>
    <button data-page="heatmap">Heatmap EA</button>
    <button data-page="oneone">One-One</button>
  </div>
</aside>
<main class="main">
  <div class="top">
    <div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Vista consolidada del plan de cierre de brechas.</p></div>
    <div class="source">Fuente conectada<br><strong id="sourceName"></strong><br><span id="sourceDate"></span></div>
  </div>
  <section id="dashboard" class="page"></section>
  <section id="people" class="page" style="display:none"></section>
  <section id="gaps" class="page" style="display:none"></section>
  <section id="capabilities" class="page" style="display:none"></section>
  <section id="guides" class="page" style="display:none"></section>
  <section id="heatmap" class="page" style="display:none"></section>
  <section id="oneone" class="page" style="display:none"></section>
</main>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="modalTitle">Detalle</h3>
      <button class="close" onclick="closeModal()">Cerrar</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>

    {"id": 2, "name": "LUIS PAEZ MOLANO", "sharp": 38601433, "display": "[38601433] LUIS PAEZ MOLANO", "position": "Operador de Tostación 2.0", "team": "Equipo 1"},

  "matrixStatus": [
    {"personId": 1, "item": "1.1", "pillar": "Maintenance", "status": "Completado", "date": "2026-04-10"},
    {"personId": 1, "item": "1.1", "pillar": "Operation", "status": "En progreso", "date": "2026-05-15"},
    {"personId": 2, "item": "1.1", "pillar": "Maintenance", "status": "Retrasado", "date": "2026-03-01"},

  ]

document.getElementById('sourceName').textContent = DATA.source;
document.getElementById('sourceDate').textContent = DATA.updated;

const navBtns = document.querySelectorAll('.nav button');
navBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    navBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const page = btn.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById(page).style.display = 'block';
    renderPage(page);
  });
});

function renderPage(page) {
  const titles = {
    dashboard: ["Dashboard SKAP 2.0", "Vista consolidada del avance general de cierre de brechas y cumplimiento."],
    people: ["Personas", "Listado de colaboradores registrados en el plan de Maltería Tibitó."],
    gaps: ["Brechas & Matriz", "Seguimiento por ítem de capacidad y estado de cumplimiento por persona."],
    capabilities: ["Capacidades SKAP (63)", "Definición oficial de preguntas, validaciones y acciones por pilar."],
    guides: ["Guías Técnicas (L6/L7/L8)", "Lógica de guías técnicas asignadas según la posición en planta."],
    heatmap: ["Heatmap EA", "Matriz visual de estado de brechas por colaborador."],
    oneone: ["One-on-One", "Registro de retroalimentación y seguimiento individual."]
  };
  if(titles[page]){
    document.getElementById('pageTitle').textContent = titles[page][0];
    document.getElementById('pageSub').textContent = titles[page][1];
  }

  const container = document.getElementById(page);
  if(page === 'dashboard') renderDashboard(container);
  else if(page === 'people') renderPeople(container);
  else if(page === 'gaps') renderGaps(container);
  else if(page === 'capabilities') renderCapabilities(container);
  else if(page === 'guides') renderGuides(container);
  else if(page === 'heatmap') renderHeatmap(container);
  else if(page === 'oneone') renderOneOne(container);
}

function renderDashboard(c) {
  c.innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Colaboradores</div><div class="num">${DATA.people.length}</div></div>
      <div class="card"><div class="label">Capacidades SKAP</div><div class="num">63</div></div>
      <div class="card"><div class="label">Brechas Evaluadas</div><div class="num">504</div></div>
      <div class="card"><div class="label">% Cumplimiento</div><div class="num" style="color:var(--green)">68%</div></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>Avance por Pilar SKAP</h3>
        <div class="progress"><div class="row"><span>Safety</span><b>82%</b></div><div class="bar"><div class="fill" style="width:82%"></div></div></div>
        <div class="progress"><div class="row"><span>Quality</span><b>75%</b></div><div class="bar"><div class="fill" style="width:75%"></div></div></div>
        <div class="progress"><div class="row"><span>Maintenance</span><b>60%</b></div><div class="bar"><div class="fill" style="width:60%"></div></div></div>
        <div class="progress"><div class="row"><span>Operation</span><b>65%</b></div><div class="bar"><div class="fill" style="width:65%"></div></div></div>
        <div class="progress"><div class="row"><span>People</span><b>58%</b></div><div class="bar"><div class="fill" style="width:58%"></div></div></div>
      </div>
      <div class="panel">
        <h3>Estado de Cierre de Brechas</h3>
        <p class="muted" style="font-size:13px">Distribución del estado de las acciones asignadas a los colaboradores en la planta.</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:15px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge completed">Completado</span><b>210 brechas</b></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge progressb">En progreso</span><b>140 brechas</b></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge scheduled">Programado</span><b>80 brechas</b></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge delayed">Retrasado</span><b>44 brechas</b></div>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge none">Sin programar</span><b>30 brechas</b></div>
        </div>
      </div>
    </div>
  `;
}

function renderPeople(c) {
  c.innerHTML = `
    <div class="people">
      ${DATA.people.map(p => `
        <div class="person" onclick="openPersonModal(${p.id})">
          <div class="name">${p.name}</div>
          <div class="meta">ID SHARP: ${p.sharp} | Cargos: ${p.position}</div>
          <div class="mini">
            <span>Equipo: ${p.team || 'Maltería Tibitó'}</span>
            <span style="color:var(--blue);font-weight:700">Ver Plan de Brechas &rarr;</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderGaps(c) {

    <div class="toolbar">
      <input type="text" class="input" placeholder="Buscar por nombre o capacidad..." id="gapSearch" onkeyup="filterGaps()">
      <select class="select" id="gapPillar" onchange="filterGaps()">
        <option value="">Todos los Pilares</option>
        <option value="Safety">Safety</option>
        <option value="Quality">Quality</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Operation">Operation</option>
      </select>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Colaborador</th>
            <th>Pillar</th>
            <th>Ítem</th>
            <th>Método Valid.</th>
            <th>Acción de Cierre</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="gapsTbody">
          ${DATA.matrixStatus.map(m => {
            const p = DATA.people.find(x => x.id === m.personId) || {};
            const cap = DATA.capabilities.find(x => x.item === m.item && x.pillar === m.pillar) || {};
            return `
              <tr>
                <td><b>${p.name || 'N/A'}</b><br><small class="muted">${p.position || ''}</small></td>
                <td>${m.pillar}</td>
                <td><b>${m.item}</b></td>
                <td>${cap.method || 'OWD / Examen'}</td>
                <td style="max-width:280px">${cap.action || 'Ejecutar plan de cierre...'}</td>
                <td><span class="badge ${getStatusClass(m.status)}">${m.status}</span></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderCapabilities(c) {
  c.innerHTML = `
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Sección</th>
            <th>Pilar</th>

function renderGuides(c) {

    <div class="panel">
      <h3>Acciones Específicas de Guías Técnicas (L6 / L7 / L8) por Posición</h3>
      <p class="muted" style="font-size:13px">Lógica alineada con la pestaña ACCIONES_MTTO_GUIA del libro de Excel. Genera automáticamente las acciones prácticas dependiendo del cargo.</p>

function renderHeatmap(c) {
  const pillars = ["Safety", "Quality", "Maintenance", "Operation", "People", "Environment", "Logistics", "Management"];
  c.innerHTML = `
    <div class="tablewrap">
      <div class="heat">
        <div class="head">Colaborador</div>
        ${pillars.map(p => `<div class="head" style="text-align:center">${p}</div>`).join('')}
        ${DATA.people.map(p => `
          <div style="font-weight:700">${p.name}</div>
          ${pillars.map(pil => {
            const st = getRandomStatus();
            return `<div class="cell ${st}">${st}</div>`;
          }).join('')}
        `).join('')}
      </div>
    </div>
  `;
}

function renderOneOne(c) {
  c.innerHTML = `
    <div class="panel">
      <h3>Seguimiento 1-on-1 de Cierre de Brechas</h3>
      <p class="muted" style="font-size:13px">Espacio de compromisos y acompañamiento personalizado entre supervisor y colaborador.</p>
      <div style="margin-top:15px;display:flex;gap:10px">
        <select class="select" id="onePerson">
          ${DATA.people.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
        <button class="btn yellow" onclick="alert('Sesión 1-on-1 registrada correctamente.')">Registrar Compromiso</button>
      </div>
    </div>
  `;
}

function getStatusClass(st) {
  if (st === 'Completado') return 'completed';
  if (st === 'En progreso') return 'progressb';
  if (st === 'Retrasado') return 'delayed';
  if (st === 'Programado') return 'scheduled';
  return 'none';
}

function getRandomStatus() {
  const list = ["Completado", "En progreso", "Retrasado", "Programado"];
  return list[Math.floor(Math.random() * list.length)];
}

function openPersonModal(id) {
  const p = DATA.people.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalTitle').textContent = `Plan de Cierre: ${p.name}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail">
      <div class="field"><label>ID SHARP</label><div>${p.sharp}</div></div>
